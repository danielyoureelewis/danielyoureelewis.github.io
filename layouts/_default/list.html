{{ define "main" }}
  <h2 class="section-title">{{ .Title }}</h2>
  <ol class="post-list">
    {{ range .Pages }}
      <li class="post-summary">
        <div class="post-date">{{ .Date.Format "01/02/2006" }}</div>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ with .Params.summary }}<p>{{ . }}</p>{{ else }}{{ .Summary }}{{ end }}
      </li>
    {{ end }}
  </ol>
{{ end }}
